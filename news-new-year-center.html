<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Новость — Экскурсии по Ярославлю</title>
  <style>
    body{ margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#f6f3ee; color:#2b2a28; }
    .container{ width: min(900px, calc(100% - 32px)); margin: 0 auto; }
    a{ color: inherit; }
    header{ padding: 18px 0 12px; }
    .top{ display:flex; justify-content:space-between; align-items:center; gap: 12px; }
    .brand{ font-weight: 950; text-decoration:none; }
    .nav a{ text-decoration:none; font-weight: 850; color:#5b3a12; margin-left: 10px; }
    .hero{
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 14px 28px rgba(30,20,10,.10);
      background: rgba(255,255,255,.65);
    }
    .cover{ height: 300px; background: #ddd center/cover no-repeat; position:relative; }
    .cover::after{ content:""; position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,.00) 20%, rgba(0,0,0,.45) 100%); }
    .badgeRow{ position:absolute; left: 14px; top: 14px; display:flex; gap: 8px; z-index: 2; }
    .badge{
      font-size: 12px; font-weight: 900;
      padding: 8px 10px; border-radius: 999px;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(0,0,0,.08);
    }
    .content{ padding: 16px 16px 18px; }
    h1{ margin: 0 0 8px; font-size: 30px; line-height: 1.15; letter-spacing:.2px; }
    .lead{ margin: 0 0 14px; color: rgba(43,42,40,.75); line-height: 1.55; }
    .article{ line-height: 1.75; font-size: 15px; }
    .article h2{ margin: 18px 0 8px; font-size: 20px; }
    .article ul{ margin: 8px 0 12px; padding-left: 18px; }
    .article blockquote{
      margin: 14px 0;
      padding: 12px 14px;
      border-left: 4px solid rgba(202,166,90,.65);
      background: rgba(202,166,90,.12);
      border-radius: 14px;
      color: rgba(43,42,40,.85);
    }
    .gallery{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }
    .ph{
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.55);
      height: 180px;
      background: #ddd center/cover no-repeat;
    }

    /* Comments */
    .comments{
      margin: 18px 0 40px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 10px 18px rgba(30,20,10,.06);
    }
    .comments h3{ margin: 4px 0 10px; font-size: 20px; }
    .form{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .form textarea{ grid-column: 1 / -1; min-height: 110px; resize: vertical; }
    input, textarea{
      width: 100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.85);
      outline: none;
    }
    .btn{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      border: 0;
      cursor:pointer;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 900;
      background: #caa65a;
      color: #231a0d;
      transition: transform .15s ease, filter .15s ease;
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.03); }
    .list{ display:grid; gap: 10px; margin-top: 10px; }
    .citem{
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 16px;
      padding: 12px;
    }
    .cmeta{ display:flex; justify-content:space-between; gap: 10px; margin-bottom: 6px; color: rgba(43,42,40,.65); font-size: 12px; }
    .ctext{ margin:0; line-height: 1.55; }

    @media (max-width: 720px){
      .cover{ height: 240px; }
      .gallery{ grid-template-columns: 1fr; }
      .form{ grid-template-columns: 1fr; }
      h1{ font-size: 26px; }
    }
  </style>
</head>
<body>
  <header class="container">
    <div class="top">
      <a class="brand" href="index.html">Экскурсии по Ярославлю</a>
      <div class="nav">
        <a href="news.html">Новости</a>
        <a href="index.html">На главную</a>
      </div>
    </div>
  </header>

  <main class="container">
    <article class="hero">
      <div class="cover" id="cover"></div>
      <div class="content">
        <h1 id="title"></h1>
        <p class="lead" id="lead"></p>
        <div class="article" id="article"></div>
      </div>
    </article>

    <section class="comments">
      <h3>Комментарии</h3>
      <div class="form">
        <input id="name" placeholder="Ваше имя" />
        <input id="contact" placeholder="Контакт (необязательно)" />
        <textarea id="text" placeholder="Напишите комментарий…"></textarea>
        <button class="btn" id="send">Отправить</button>
      </div>
      <div class="list" id="list"></div>
    </section>
  </main>

  <script>
    // ====== ВСТАВЬ СЮДА КОНТЕНТ КАЖДОЙ НОВОСТИ ======
    const ARTICLE = {
      id: "demo",
      title: "Заголовок новости",
      lead: "Короткий лид: о чём материал и зачем читать.",
      tag: "Тема",
      date: "01.01.2026",
      readTime: "5 мин",
      cover: "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=1600&q=70",
      html: `
        <p>Текст новости…</p>
      `
    };

    // render
    document.title = ARTICLE.title + " — Экскурсии по Ярославлю";
    document.getElementById("cover").style.backgroundImage = `url('${ARTICLE.cover}')`;
    document.getElementById("cover").innerHTML = `
      <div class="badgeRow">
        <div class="badge">${ARTICLE.tag}</div>
        <div class="badge">${ARTICLE.date}</div>
        <div class="badge">${ARTICLE.readTime}</div>
      </div>
    `;
    document.getElementById("title").textContent = ARTICLE.title;
    document.getElementById("lead").textContent = ARTICLE.lead;
    document.getElementById("article").innerHTML = ARTICLE.html;

    // ===== Comments (localStorage) =====
    const key = "comments:" + ARTICLE.id;

    const esc = (s) => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const load = () => JSON.parse(localStorage.getItem(key) || "[]");
    const save = (arr) => localStorage.setItem(key, JSON.stringify(arr));

    const listEl = document.getElementById("list");
    const renderComments = () => {
      const data = load().slice().reverse();
      listEl.innerHTML = data.length ? data.map(c => `
        <div class="citem">
          <div class="cmeta">
            <div><b>${esc(c.name || "Гость")}</b>${c.contact ? " · " + esc(c.contact) : ""}</div>
            <div>${esc(c.date)}</div>
          </div>
          <p class="ctext">${esc(c.text)}</p>
        </div>
      `).join("") : `<div style="color:rgba(43,42,40,.65)">Пока нет комментариев — будет первым 🙂</div>`;
    };

    document.getElementById("send").addEventListener("click", () => {
      const name = document.getElementById("name").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const text = document.getElementById("text").value.trim();
      if(!text) return alert("Напиши текст комментария 🙂");

      const now = new Date();
      const dd = String(now.getDate()).padStart(2,"0");
      const mm = String(now.getMonth()+1).padStart(2,"0");
      const yyyy = now.getFullYear();

      const arr = load();
      arr.push({ name, contact, text, date: `${dd}.${mm}.${yyyy}` });
      save(arr);

      document.getElementById("text").value = "";
      renderComments();
    });

    renderComments();
  </script>
</body>
</html>

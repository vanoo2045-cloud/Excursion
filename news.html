<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Новости — Экскурсии по Ярославлю</title>
  <style>
    body{ margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#f6f3ee; color:#2b2a28; }
    .container{ width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
    header{ padding: 22px 0; }
    a{ color: inherit; }
    .topbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .brand{ font-weight: 900; letter-spacing:.2px; text-decoration:none; }
    .back{ text-decoration:none; font-weight: 800; color:#5b3a12; }
    .title{ margin: 14px 0 6px; font-size: 34px; }
    .subtitle{ margin:0 0 18px; color: rgba(43,42,40,.68); }

    .grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding-bottom: 40px; }

    .card{
      display:grid; grid-template-rows: 180px auto;
      border-radius: 18px; overflow:hidden;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 10px 18px rgba(30,20,10,.06);
      text-decoration:none;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .card:hover{ transform: translateY(-2px); background: rgba(255,255,255,.78); box-shadow: 0 14px 26px rgba(30,20,10,.10); }
    .cover{ position:relative; background:#ddd center/cover no-repeat; }
    .cover::after{ content:""; position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,.00) 25%, rgba(0,0,0,.40) 100%); }
    .tag{ position:absolute; left:12px; top:12px; z-index:2; font-size:12px; font-weight:900; padding:7px 10px; border-radius:999px; background: rgba(255,255,255,.86); border:1px solid rgba(0,0,0,.08); }
    .date{ position:absolute; right:12px; top:12px; z-index:2; font-size:12px; padding:7px 10px; border-radius:999px; background: rgba(255,255,255,.86); border:1px solid rgba(0,0,0,.08); color: rgba(43,42,40,.72); }
    .body{ padding: 12px 12px 14px; display:grid; gap: 8px; }
    h3{ margin:0; font-size: 17px; line-height: 1.25; font-weight: 950; }
    p{ margin:0; font-size: 13px; line-height: 1.45; color: rgba(43,42,40,.72); }
    .meta{ display:flex; justify-content:space-between; align-items:center; margin-top: 6px; }
    .rt{ font-size:12px; color: rgba(43,42,40,.62); }
    .more{ font-size:13px; font-weight: 900; color:#8b5a1c; }

    @media (max-width: 980px){ .grid{ grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px){ .grid{ grid-template-columns: 1fr; } .title{ font-size: 28px; } }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="topbar">
        <a class="brand" href="index.html">Экскурсии по Ярославлю</a>
        <a class="back" href="index.html">← На главную</a>
      </div>
      <h1 class="title">Новости</h1>
      <p class="subtitle">Полезные материалы, анонсы и идеи прогулок — обновляется регулярно.</p>
    </div>
  </header>

  <main class="container">
    <div class="grid" id="newsGrid"></div>
  </main>

  <script>
    const NEWS = [
      {
        id: "new-year-center",
        title: "Новогодний центр Ярославля: где красивее всего гулять вечером",
        excerpt: "Собрал маршрут по огонькам: Стрелка, набережная и лучшие точки для фото. Плюс — что посмотреть рядом.",
        date: "31.12.2025",
        tag: "Маршрут",
        readTime: "6 мин",
        image: "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=1600&q=70",
        url: "news-new-year-center.html"
      },
      {
        id: "red-perekop",
        title: "Красный Перекоп: промышленная история и неожиданная красота района",
        excerpt: "Петропавловский парк с прудами, мануфактура и места Терешковой — почему это must-see вне центра.",
        date: "28.12.2025",
        tag: "Район",
        readTime: "7 мин",
        image: "https://images.unsplash.com/photo-1523413452443-30d0e2c1d0b1?auto=format&fit=crop&w=1600&q=70",
        url: "news-red-perekop.html"
      },
      {
        id: "cinema",
        title: "КиноЯрославль: 5 локаций, где снимали культовые фильмы",
        excerpt: "«Афоня», «Большая перемена», «Экипаж» — покажу места, где кино становится реальностью.",
        date: "24.12.2025",
        tag: "Кино",
        readTime: "5 мин",
        image: "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=1600&q=70",
        url: "news-cinema.html"
      },
      {
        id: "tips",
        title: "Как выбрать экскурсию в Ярославле: 7 простых подсказок",
        excerpt: "На что смотреть кроме цены: темп, маршрут, сезон, дети, интересы группы и формат общения.",
        date: "20.12.2025",
        tag: "Советы",
        readTime: "4 мин",
        image: "https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1600&q=70",
        url: "news-tips.html"
      }
    ];

    document.getElementById("newsGrid").innerHTML = NEWS.map(n => `
      <a class="card" href="${n.url}">
        <div class="cover" style="background-image:url('${n.image}')">
          <div class="tag">${n.tag}</div>
          <div class="date">${n.date}</div>
        </div>
        <div class="body">
          <h3>${n.title}</h3>
          <p>${n.excerpt}</p>
          <div class="meta">
            <span class="rt">${n.readTime}</span>
            <span class="more">Читать →</span>
          </div>
        </div>
      </a>
    `).join("");
  </script>
</body>
</html>
